services:
  main:
    build: .
    volumes:
      - .:/app
      # Host paths come from environment variables or a local .env file
      # (see .env.example). They default to the sample folders.
      - ${PHOTOS_DIR:-./samplephotos}:/photos
      - ${CLASSIFIED_DIR:-./classified}:/classified
      - ${DB_DIR:-./db}:/db
    environment:
      DB_PATH: /db/photos.db
